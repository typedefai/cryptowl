[project]
name = "cryptowl-devkit"
version = "0.1.0"
description = "Minimal CryptOwl vault developer toolkit (PySide6, byte-compatible with the Android app)"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "pycryptodome>=3.19",
    "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
cryptowl-devkit = "cryptowl_devkit.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cryptowl_devkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
